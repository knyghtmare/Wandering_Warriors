[campaign]
	id = "Wandering_Warriors"
	name = "Wandering Warriors"
	icon = "data/add-ons/Wandering_Warriors/images/guard.png~RC(magenta>red)"
	abbrev = "WW"
	description = "Following the creation of an Aragwaithi kingdom in the Northlands, some idiot who can't write good campaigns decided to have another stab at causing their audience to spontaneously combust in frustration, and so a group of soldiers serving the Northern Alliance uncovered the movements of traitorous armies amongst the frozen North. (Intermediate level, 8 scenarios)"
