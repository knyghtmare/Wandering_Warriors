    abbrev=_"WW"
    description=_"Following the creation of the Aragwaithi kingdom in the Northlands, a group of soldiers serving the Northern Alliance uncovered the movements of traitorous armies amongst the Frozen North. (Intermediate level, 8 scenarios)"
