	define = WANDERING_WARRIORS
	year = 250 BF
	rank = 102
	{CAMPAIGN_DIFFICULTY EASY   "data/add-ons/Wandering_Warriors/images/swordsman.png~RC(magenta>red)" ( _ "Spearman") ( _ "Easy")}
    {CAMPAIGN_DIFFICULTY NORMAL "data/add-ons/Wandering_Warriors/images/guard.png~RC(magenta>red)" ( _ "Flagbearer") ( _ "Normal")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD   "data/add-ons/Wandering_Warriors/images/shield-guard.png~RC(magenta>red)" ( _ "Captain") ( _ "Hard")}
	first_scenario = "1_Sellswords"
[/campaign]

