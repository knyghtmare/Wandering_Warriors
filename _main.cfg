    {CAMPAIGN_DIFFICULTY HARD   "data/add-ons/War_of_Legends/images/units/human-aragwaithi/shield-guard.png~RC(magenta>green)" ( _ "Sentinel") ( _ "Difficult")}

    first_scenario = "1_Sellswords"
[/campaign]

#ifdef CAMPAIGN_WANDERING_WARRIORS
# load the dependency addon
