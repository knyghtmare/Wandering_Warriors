[scenario]
    id="6_Glamdrol"
    map_file=6_Glamdrol.map
    name="Glamdrol"
    turns=35
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=7_Entrapment
    [story]
        [part]
            story =_  "Argark, their Trollian guide, led them safely through the passages to the city of Glamdrol, whence a group of magi and shamans worked. He had heard that they wished to speak with the Aragwaithi."
        [/part]
        [part]
            story =_  "However, the traitorous orcs had other plans for the loyalist city."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 250 230 200}
        type = "Aragwaith Guard"
        name = _ "Meranyc"
        id = "Meranyc"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = human
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Warrior, Orcish Archer, Orcish Crossbowman, Wolf Rider, Goblin Knight, Troll Whelp, Troll, Troll Rocklobber, Troll Shaman, Orcish Shaman, Orcish Warlock"
        team_name = "Allies"
        user_team_name =_  "Alliance Orcs"
        {GOLD 250 225 200}
        type = "Orcish Sovereign"
        name = "Tan-Aras"
        id = "TanAras"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Archer, Wolf Rider, Orcish Warrior, Orcish Crossbowman, Goblin Knight"
        team_name = "Enemies"
        user_team_name =_  "Traitor Orcs"
        {GOLD 140 160 180}
        type = "Orcish Warlord"
        name = "Tan-Hekar"
        id = "Hekar"
        unrenameable = yes
    [/side]
    [side]
        side = 4
        controller = ai
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Archer, Wolf Rider, Orcish Warrior, Orcish Crossbowman, Goblin Knight"
        team_name = "Enemies"
        user_team_name =_  "Traitor Orcs"
        {GOLD 160 180 200}
        type = "Orcish Warlord"
        name = "Tan-Ark"
        id = "TanArk"
        unrenameable = yes
    [/side]
    [side]
        side = 5
        controller = ai
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Archer, Wolf Rider, Orcish Warrior, Orcish Crossbowman, Goblin Knight"
        team_name = "Enemies"
        user_team_name =_  "Traitor Orcs"
        {GOLD 120 140 160}
        type = "Orcish Slurbow"
        name = "Tan-Skalan"
        id = "Tan-Skalan"
        unrenameable = yes
    [/side]
    [side]
        side = 6
        controller = ai
        canrecruit = yes
        recruit = "Orcish Archer, Wolf Rider, Orcish Crossbowman, Goblin Knight, Goblin Pillager, Direwolf Rider"
        team_name = "Enemies"
        user_team_name =_  "Traitor Orcs"
        {GOLD 140 160 180}
        type = "Direwolf Rider"
        name = "Parak"
        id = "Parak"
        unrenameable = yes
    [/side]
    [side]
        side = 7
        controller = ai
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Warrior, Troll Whelp, Troll, Troll Rocklobber, Troll Shaman, Troll Warrior, Troll Hero, Young Ogre, Ogre"
        team_name = "Enemies"
        user_team_name =_  "Traitor Orcs"
        {GOLD 160 180 200}
        type = "Troll Warrior"
        name = "Gareak"
        id = "Gareak"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=0
            [objective]
                condition=win
                description= _ "Defeat all enemy leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes or allied leaders."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [recall]
            id = Asidel
            x = 14
            y = 23
        [/recall]
        [recall]
            id = Argark
            x = 18
            y = 25
        [/recall]
        {LOYAL_UNIT 2 (Orcish Warlord) 12 14}
        {LOYAL_UNIT 2 (Orcish Warlord) 26 14}
        {LOYAL_UNIT 2 (Orcish Warlord) 12 7}
        {LOYAL_UNIT 2 (Orcish Warlord) 26 7}
        {LOYAL_UNIT 2 (Orcish Sorcerer) 17 11}
        {LOYAL_UNIT 2 (Orcish Sorcerer) 21 11}
    [/event]
    [event]
        name = start
        [message]
            speaker = Argark
            message =_  "Here, friends, Glamdrol awaits."
        [/message]
        [message]
            speaker = TanAras
            message =_  "Well met, Aragwaithi! The magi of this city have much to tell you, but it must wait, for here is the army of the traitor orcs, and we are sorely pressed!"
        [/message]
        [message]
            speaker = Meranyc
            message =_  "Well met, Tan-Aras! Hurry, soldiers, to the defence of the city!"
        [/message]
        [message]
            speaker = TanArk
            message =_  "Today, the true orcs will prevail! Burn this city!"
        [/message]
        [message]
            speaker = Asidel
            message =_  "Upon this day, naught shall come to pass but the staining of the snow with the blood of traitors!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id=TanAras
        [/filter]
        [message]
            speaker = TanAras
            message =_  "Glamdrol falls, and so the alliance may be undone!"
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]

    [event]
        name = enemies defeated
        [unit]
            type="Savant"
            canrecruit=no
            {IS_HERO}
            id="Mara"
            name = _ "Mara"
            side = 1
            x = 24
            y = 9
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_INTELLIGENT}
                {TRAIT_DEXTROUS}
            [/modifications]
        [/unit]
        [message]
            speaker = TanAras
            message =_  "Thank you, worthy allies! My shamans have told me of dark forces stirring, those we have fought today and those yet to come. This human-witch desires to take you North again; she has prophesised that you may be able to destroy our enemies there, and carry us victorious."
        [/message]
        [endlevel]
            result = victory
        [/endlevel]
    [/event]

    [event]
        name = last breath
        [filter]
            id = Meranyc
        [/filter]
        [message]
            speaker = Meranyc
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Asidel"
        [/filter]
        [message]
            speaker = Asidel
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
