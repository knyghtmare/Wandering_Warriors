[scenario]
	id="2_Drake_Mountains"
	map_data="{~add-ons/Wandering_Warriors/maps/2_Drake_Mountains.map}"
	name="Drake Mountains"
	turns=35
	{DEFAULT_SCHEDULE}
	{DEFAULT_MUSIC_PLAYLIST}
	next_scenario=3_Winter_Fortress
	[story]
		[part]
			story = "The bandit leader had mentioned that he had taken that stronghold and raided the village in order to defend himself from something."
		[/part]
		[part]
			story = "Believing this to be of consequence, a few of Meranyc's men moved Northwards to investigate, into the snowy mountains."
		[/part]
	[/story]
	[side]
		side = 1
		controller = human
		canrecruit = yes
		recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
		team_name = "Allies"
		user_team_name = "Aragwaith"
		{GOLD 180 160 140}
		type = "Aragwaith Guard"
		name = _ "Meranyc"
		id = "Meranyc"
		unrenameable = yes
		[modifications]
			{TRAIT_LOYAL}
			{TRAIT_STRONG}
			{TRAIT_RESILIENT}
		[/modifications]
	[/side]
	[side]
		side = 2
		controller = ai
		canrecruit = yes
		recruit = "Drake Burner, Drake Clasher, Drake Fighter"
		team_name = "Enemies"
		user_team_name = "Drakes"
		{GOLD 120 140 160}
		type = "Drake Arbiter"
		name = "Magar"
		id = "Magar"
		unrenameable = yes
	[/side]
	[side]
		side = 3
		controller = ai
		canrecruit = yes
		recruit = "Drake Burner, Drake Fighter, Drake Glider"
		team_name = "Enemies"
		user_team_name = "Drakes"
		{GOLD 120 140 160}
		type = "Drake Flare"
		name = "Asthan"
		id = "Asthan"
		unrenameable = yes
	[/side]
	[side]
		side = 4
		controller = ai
		canrecruit = yes
		recruit = "Drake Clasher, Drake Burner, Fire Drake, Drake Thrasher, Drake Arbiter"
		team_name = "Enemies"
		user_team_name = "Drake Leaders"
		{GOLD 160 180 200}
		type = "Drake Flameheart"
		name = "Kasath"
		id = "Kasath"
		unrenameable = yes
	[/side]
	[event]
		name = prestart

        	[objectives]
            		side=1
           	[objective]
                	condition=win
                	description= _ "Defeat all enemy leaders."
            	[/objective]
            	[objective]
                	condition=lose
                	description= _ "Death of the heroes."
           	[/objective]
		{TURNS_RUN_OUT}
		[/objectives]
		
		[recall]
			id = Asidel
			x = 30
			y = 18
		[/recall]
	[/event]
	[event]
		name = start
		[message]
			speaker = Meranyc
			message = "We have reached the end of the mountain chain. What have the scouts reported?"
		[/message]
		[message]
			speaker = Asidel
			message = "A great host of drakes, commander! It is most queer, for 'tis nearly winter and they should be hibernating in the ordinary way of things."
		[/message]
		[message]
			speaker = Kasath
			message = "What? Aragwaithi? They learnt of our plans so quickly!"
		[/message]
		[message]
			speaker = Meranyc
			message = "They have noticed us! Be on your guard!"
		[/message]
	[/event]
	[event]
		name = last breath
		[filter]
			id=Magar
		[/filter]
		[message]
			speaker = Magar
			message = "I may fall, but the might of the drakes lives on!"
		[/message]
		{LOOT 100 1}
	[/event]
	[event]
		name = last breath
		[filter]
			id=Asthan
		[/filter]
		[message]
			speaker = Asthan
			message = "What? I, die? I, who descend from Shek'khan himself?"
		[/message]
		{LOOT 120 1}
	[/event]
	[event]
		name = last breath
		[filter]
			id=Kasath
		[/filter]
		[message]
			speaker = Kasath
			message = "Us overwhelmed? Messenger, take this - alert the army - *gurgle* *thud*"
		[/message]
		{LOOT 140 1}
	[/event]
	[event]
		name = last breath
		[filter]
			id = Meranyc
		[/filter]
		[message]
			speaker = Meranyc
			message = "Thus I fall, and so do my soldiers."
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]
	[event]
		name = last breath
		[filter]
			id="Asidel"
		[/filter]
		[message]
			speaker = Asidel
			message = "Dear Gods..."
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]	
[/scenario]
