[scenario]
    id="7_Entrapment"
    map_file=7_Entrapment.map
    name="Entrapment"
    turns=30
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=8_Dragonfire
    experience_modifier={ON_DIFFICULTY 80 80 100}
    
    [story]
        [part]
            story =_  "The witch Mara led them Northwards to a gap in the hillside, uncovering through magics the tracks of the routed orcish army otherwise covered in snow."
        [/part]
        [part]
            story =_  "There, as the shamans had scry'd, the orcish army was surrounded."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 180 160 140}
        type = "Aragwaith Guard"
        name = _ "Meranyc"
        id = "Meranyc"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Orcish Warrior, Orcish Crossbowman, Goblin Knight, Orcish Warlord, Orcish Slurbow, Direwolf Rider, Goblin Pillager"
        team_name = "Orcs"
        user_team_name =_  "Orcs"
        {GOLD 220 240 260}
        type = "Orcish Sovereign"
        name = "Tan-Jarak"
        id = "TanJarak"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Orcish Warrior, Orcish Crossbowman, Goblin Knight, Goblin Pillager, Wolf Rider, Orcish Grunt, Orcish Archer, Orcish Assassin, Orcish Slayer"
        team_name = "Orcs"
        user_team_name =_  "Orcs"
        {GOLD 180 200 220}
        type = "Orcish Warlord"
        name = "Erisch"
        id = "Erisch"
        unrenameable = yes
    [/side]
    [side]
        side = 4
        controller = ai
        canrecruit = yes
        recruit = "Troll Whelp, Troll, Troll Rocklobber, Troll Shaman, Troll Warrior, Young Ogre, Ogre"
        team_name = "Orcs"
        user_team_name =_  "Trolls"
        {GOLD 160 180 200}
        type = "Great Troll"
        name = "Makach"
        id = "Makach"
        unrenameable = yes
    [/side]
    [side]
        side = 5
        controller = ai
        canrecruit = yes
        recruit = "Fire Drake, Drake Arbiter, Drake Thrasher, Drake Warrior, Drake Blademaster, Inferno Drake, Drake Flameheart"
        team_name = "Enemies"
        user_team_name =_  "Drakes"
        {GOLD 200 220 240}
        type = "Drake Warden"
        name = "Halerd"
        id = "Halerd"
        unrenameable = yes
    [/side]
    [side]
        side = 6
        controller = ai
        canrecruit = yes
        recruit = "Fire Drake, Drake Thrasher, Drake Arbiter, Drake Warrior, Drake Blademaster, Inferno Drake, Drake Flameheart"
        team_name = "Enemies"
        user_team_name =_  "Drake Leaders"
        {GOLD 240 260 280}
        type = "Armageddon Drake"
        name = "Ashan"
        id = "Ashan"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Defeat all enemy leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [recall]
            id = Asidel
            x = 12
            y = 32
        [/recall]
        [recall]
            id = Mara
            x = 13
            y = 30
        [/recall]
    [/event]
    [event]
        name = start
        [message]
            speaker = Mara
            message =_  "Here, the remains of the orc army! Trap them in the snows, and destroy the traitors utterly."
        [/message]
        [message]
            speaker = TanJarak
            message =_  "Is this all that remains of the true orcs, who consort not with dirtgrubbers and treehuggers? Well then, we shall destroy them nonetheless! To arms!"
        [/message]
        [message]
            speaker = Ashan
            message =_  "The army of Ashak'kahan is here, to destroy all those who would oppose our might!"
        [/message]
        [message]
            speaker = Meranyc
            message =_  "Soldiers of the Aragwaithi! Destroy them!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id=TanJarak
        [/filter]
        [message]
            speaker = TanJarak
            message =_  "With my last breath, I spit upon thee, clothmen and fire-worms!"
        [/message]
        {LOOT 150 1}
    [/event]
    [event]
        name = last breath
        [filter]
            id=Ashan
        [/filter]
        [message]
            speaker = Ashan
            message =_  "I may die, but Ashak'kahan shall destroy you all!"
        [/message]
        {LOOT 150 1}
    [/event]
    [event]
        name = last breath
        [filter]
            id = Meranyc
        [/filter]
        [message]
            speaker = Meranyc
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Asidel"
        [/filter]
        [message]
            speaker = Asidel
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Mara"
        [/filter]
        [message]
            speaker = Asidel
            message =_  "Without the knowledge of the scribes, we shall be unable to defeat our enemies!"
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
