[scenario]
    id="8_Dragonfire"
    map_file=8_Dragonfire.map
    name="Dragonfire"
    turns=100
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=null
    experience_modifier={ON_DIFFICULTY 80 80 100}

    [story]
        [part]
            story =_  "Having destroyed the orcish army, they made haste to discover the cause of the stirring dark forces."
        [/part]
        [part]
            story =_  "In a region renowned for its volcanism, surrounded by snowy mountains, they came upon the cause of the disturbance."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 350 325 300}
        type = "Aragwaith Guard"
        name = _ "Mamoru"
        id = "Mamoru"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Drake Blademaster, Inferno Drake, Drake Flameheart, Hurricane Drake, Drake Warden, Drake Enforcer"
        team_name = "Enemies"
        user_team_name =_  "Ashak'kahan"
        {GOLD 400 450 500}
        income = 40
        type = "Fire Dragon"
        name = "Ashak'kahan"
        id = "Ashakkahan"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Drake Blademaster, Inferno Drake, Drake Warden, Drake Enforcer, Fire Guardian, Drake Warrior, Fire Drake, Drake Arbiter, Drake Thrasher"
        team_name = "Enemies"
        user_team_name =_  "Drakes"
        {GOLD 180 200 220}
        income = 20
        type = "Armageddon Drake"
        name = "Alash"
        id = "Alash"
        unrenameable = yes
    [/side]
    [side]
        side = 4
        controller = ai
        canrecruit = yes
        recruit = "Drake Blademaster, Inferno Drake, Drake Warden, Drake Enforcer, Fire Guardian, Drake Warrior, Fire Drake, Drake Arbiter, Drake Thrasher"
        team_name = "Enemies"
        user_team_name =_  "Drakes"
        {GOLD 180 200 220}
        income = 20
        type = "Armageddon Drake"
        name = "Kranak"
        id = "Kranak"
        unrenameable = yes
    [/side]
    [side]
        side = 5
        controller = ai
        canrecruit = yes
        recruit = "Saurian Ambusher, Saurian Oracle, Saurian Soothsayer"
        team_name = "Enemies"
        user_team_name =_  "Saurians"
        {GOLD 200 220 240}
        type = "Saurian Flanker"
        name = "Issir"
        id = "Issir"
        unrenameable = yes
    [/side]
    [side]
        side = 6
        controller = ai
        canrecruit = yes
        recruit = "Saurian Ambusher, Saurian Oracle, Saurian Soothsayer"
        team_name = "Enemies"
        user_team_name =_  "Drake Leaders"
        {GOLD 200 220 240}
        type = "Saurian Flanker"
        name = "Alkess"
        id = "Alkess"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Defeat all enemy leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes."
            [/objective]
            {TURNS_RUN_OUT}
            [note]
                description = _ "This is the last scenario."
            [/note]
        [/objectives]

        [recall]
            id = Ayame
            x = 9
            y = 25
        [/recall]
        [recall]
            id = Mara
            x = 9
            y = 23
        [/recall]
    [/event]
    [event]
        name = start
        [message]
            speaker = Mara
            message =_  "At last, we have found it! Look upon this valley and see those arrayed against us!"
        [/message]
        [message]
            speaker = Ashakkahan
            message =_  "I, Ashak'kahan, son of Khrakras, lord of the true dragons and master of the lizard-wyrms, declare these Aragwaithi to be heretics. My soldiers, destroy them!"
        [/message]
        [message]
            speaker = Ayame
            message =_  "Look at the armies arrayed against us! He has stirred nearly every disloyal drake in the Northlands, and he has awakened the extinct volcanoes against us!"
        [/message]
        [message]
            speaker = Mamoru
            message =_  "Hold fast, men!"
        [/message]
    [/event]
    [event]
        name = turn 8
        {NAMED_LOYAL_UNIT 2 (Fire Wraith) 16 14 (Effusi) ( _ "Effusi")}
        {LOYAL_UNIT 2 (Fire Wraith) 28 16}
        {LOYAL_UNIT 2 (Fire Wraith) 18 8}
        {LOYAL_UNIT 2 (Fire Wraith) 26 9}
        {LOYAL_UNIT 2 (Fire Wraith) 27 7}
        {LOYAL_UNIT 2 (Fire Wraith) 28 5}
        {LOYAL_UNIT 2 (Fire Wraith) 30 6}
        [message]
            speaker = Ashakkahan
            message =_  "Rise, my allies, from the beating heart of Irdya itself!"
        [/message]
        [message]
            speaker = Effusi
            message =_  "We obey, my lord! More shall follow!"
        [/message]
    [/event]
    [event]
        name = turn 12
        [message]
            speaker = Mara
            message =_  "I have sent word, and we have received reinforcements!"
        [/message]
        {LOOT 500 1}
    [/event]
    [event]
        name = turn 16
        {LOYAL_UNIT 2 (Inferno Drake) 16 14}
        {LOYAL_UNIT 2 (Inferno Drake) 28 16}
        {LOYAL_UNIT 2 (Inferno Drake) 18 8}
        {LOYAL_UNIT 2 (Inferno Drake) 26 9}
        {LOYAL_UNIT 2 (Inferno Drake) 27 7}
        {LOYAL_UNIT 2 (Inferno Drake) 28 5}
        {LOYAL_UNIT 2 (Inferno Drake) 30 6}
        [message]
            speaker = Mamoru
            message =_  "The dragon has called forth allies from the volcanoes! On your guard, soldiers!"
        [/message]
    [/event]
    [event]
        name = turn 20
        [message]
            speaker = Ayame
            message =_  "More aid from the Northern Alliance!"
        [/message]
        {LOOT 300 1}
    [/event]

    [event]
        name = last breath
        [filter]
            id=Ashakkahan
        [/filter]
        [message]
            speaker = Ashakkahan
            message =_  "I am the greatest of the dragon lords! Why should a mere mortal destroy me?"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Mamoru
        [/filter]
        [message]
            speaker = Mamoru
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Ayame"
        [/filter]
        [message]
            speaker = Ayame
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Mara"
        [/filter]
        [message]
            speaker = Ayame
            message =_  "Without the knowledge of the scribes, we shall be unable to defeat our enemies!"
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = enemies defeated
        [message]
            speaker = Ayame
            message =_  "Dear gods, we have spilt so much blood today!"
        [/message]
        [message]
            speaker = Mamoru
            message =_  "But not without cause! We have made the Northlands safe today from all that threatens them."
        [/message]
        [message]
            speaker = narrator
            message =_  "And so it was that the Northlands were troubled by little more than bandits for nigh on half a century."
        [/message]
        [endlevel]
            result = victory
        [/endlevel]
    [/event]
[/scenario]
