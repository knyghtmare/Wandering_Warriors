[scenario]
    id="5_Odd_Enmity"
    map_file=5_Odd_Enmity.map
    name="Odd Enmity"
    turns=20
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=6_Glamdrol
    experience_modifier={ON_DIFFICULTY 80 80 100}
    
    [story]
        [part]
            story =_  "The Aragwaith made haste away from the armies of the orcs and the drakes, aiming southwards toward the Heart Mountains, wherein they knew the inhabitants to be loyal to the Northern Alliance."
        [/part]
        [part]
            story =_  "They reached the gates to the underground passages, at this time guarded by a troll chief. However, at the same time, they sighted another troll tribe flying the banners of the traitor orcs."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 160 140 120}
        type = "Aragwaith Guard"
        name = _ "Mamoru"
        id = "Mamoru"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Troll Whelp, Troll, Troll Shaman, Troll Rocklobber"
        team_name = "Allies"
        user_team_name =_  "Alliance Trolls"
        {GOLD 120 100 80}
        type = "Great Troll"
        name = "Garok"
        id = "Garok"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Troll Whelp, Troll, Troll Hero, Troll Rocklobber, Troll Shaman, Young Ogre, Ogre"
        team_name = "Enemies"
        user_team_name =_  "Enemy Trolls"
        {GOLD 200 225 250}
        type = "Troll Warrior"
        name = "Agak"
        id = "Agak"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Defeat all enemy leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes or allies."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [unit]
            type="Troll Whelp"
            canrecruit=no
            id="Argark"
            name = _ "Argark"
            side = 1
            x = 6
            y = 8
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESILIENT}
                {TRAIT_STRONG}
            [/modifications]
        [/unit]

        [recall]
            id = Ayame
            x = 4
            y = 5
        [/recall]
    [/event]
    [event]
        name = start
        [message]
            speaker = Argark
            message =_  "Chief Garok! Here are Aragwaithi allies. Here are traitor tribes. Honor the Northern Alliance!"
        [/message]
        [message]
            speaker = Ayame
            message =_  "Hail, chief of trolls! The traitor tribes shall be destroyed."
        [/message]
        [message]
            speaker = Garok
            message =_  "Let us destroy the traitor tribes, honorable allies!"
        [/message]
        [message]
            speaker = Mamoru
            message =_  "Most certainly! Attack!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id=Agak
        [/filter]
        [message]
            speaker = Argark
            message =_  "The traitor trolls are dead. Let me guide you to the city of Glamdrol. The shamans want to speak to you."
        [/message]
        {LOOT 100 1}
    [/event]
    [event]
        name = last breath
        [filter]
            id=Garok
        [/filter]
        [message]
            speaker = Garok
            message =_  "What? The traitors prevail?"
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id=Argark
        [/filter]
        [message]
            speaker = Mamoru
            message =_  "Our guide is dead; we shall not make it through the tunnels."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Mamoru
        [/filter]
        [message]
            speaker = Mamoru
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Ayame"
        [/filter]
        [message]
            speaker = Ayame
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
