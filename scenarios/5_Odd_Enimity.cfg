[scenario]
	id="5_Odd_Enimity"
	map_data="{~add-ons/Wandering_Warriors/maps/5_Odd_Enimity.map}"
	name="Odd Enimity"
	turns=20
	{DEFAULT_SCHEDULE}
	{DEFAULT_MUSIC_PLAYLIST}
	next_scenario=6_Glamdrol
	[story]
		[part]
			story = "The Aragwaith made haste away from the armies of the orcs and the drakes, aiming Southwards towards the Heart Mountains, wherein they knew the inhabitants to be loyal to the Northern Alliance."
		[/part]
		[part]
			story = "They reached the gates to the underground passages, at this time guarded by a troll chief. However, at the same time, they sighted another trollian tribe flying the banners of the traitor-orcs."
		[/part]
	[/story]
	[side]
		side = 1
		controller = human
		canrecruit = yes
		recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
		team_name = "Allies"
		user_team_name = "Aragwaith"
		{GOLD 160 140 120}
		type = "Aragwaith Guard"
		name = _ "Meranyc"
		id = "Meranyc"
		unrenameable = yes
		[modifications]
			{TRAIT_LOYAL}
			{TRAIT_STRONG}
			{TRAIT_RESILIENT}
		[/modifications]
	[/side]
	[side]
		side = 2
		controller = ai
		canrecruit = yes
		recruit = "Troll Whelp, Troll, Troll Shaman, Troll Rocklobber"
		team_name = "Allies"
		user_team_name = "Alliance Trolls"
		{GOLD 120 100 80}
		type = "Great Troll"
		name = "Garok"
		id = "Garok"
		unrenameable = yes
	[/side]
	[side]
		side = 3
		controller = ai
		canrecruit = yes
		recruit = "Troll Whelp, Troll, Troll Hero, Troll Rocklobber, Troll Shaman, Young Ogre, Ogre"
		team_name = "Enemies"
		user_team_name = "Enemy Trolls"
		{GOLD 200 225 250}
		type = "Troll Warrior"
		name = "Agak"
		id = "Agak"
		unrenameable = yes
	[/side]
	[event]
		name = prestart

        	[objectives]
            		side=1
           	[objective]
                	condition=win
                	description= _ "Defeat all enemy leaders."
            	[/objective]
            	[objective]
                	condition=lose
                	description= _ "Death of the heroes or allies."
           	[/objective]
		{TURNS_RUN_OUT}
		[/objectives]
		
		[unit]
			type="Troll Whelp"
			canrecruit=no
			id="Argark"
			name = _ "Argark"
			side = 1
			x = 6
			y = 8
			[modifications]
				{TRAIT_LOYAL}
				{TRAIT_RESILIENT}
				{TRAIT_STRONG}
			[/modifications]
		[/unit]
		
		[recall]
			id = Asidel
			x = 4
			y = 5
		[/recall]
	[/event]
	[event]
		name = start
		[message]
			speaker = Argark
			message = "Chief Garok! Here are Aragwaithi allies. Here are traitor tribes. Honour the Northern alliance!"
		[/message]
		[message]
			speaker = Asidel
			message = "Hail, chief of trolls! The traitor tribes shall be destroyed."
		[/message]
		[message]
			speaker = Garok
			message = "Let us destroy the traitor tribes, honourable allies!"
		[/message]
		[message]
			speaker = Meranyc
			message = "Most certainly! Attack!"
		[/message]
	[/event]
	[event]
		name = last breath
		[filter]
			id=Agak
		[/filter]
		[message]
			speaker = Argark
			message = "The traitor trolls are dead. Let me guide you to the city of Glamdrol. Shamans want to speak to you."
		[/message]
		{LOOT 100 1}
	[/event]
	[event]
		name = last breath
		[filter]
			id=Garok
		[/filter]
		[message]
			speaker = Garok
			message = "What? The traitors prevail?"
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]
	[event]
		name = last breath
		[filter]
			id=Argark
		[/filter]
		[message]
			speaker = Meranyc
			message = "Our guide is dead; we shall not make it through the tunnels."
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]
	[event]
		name = last breath
		[filter]
			id = Meranyc
		[/filter]
		[message]
			speaker = Meranyc
			message = "Thus I fall, and so do my soldiers."
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]
	[event]
		name = last breath
		[filter]
			id="Asidel"
		[/filter]
		[message]
			speaker = Asidel
			message = "Dear Gods..."
		[/message]
		[endlevel]
			result = defeat
		[/endlevel]
	[/event]	
[/scenario]
