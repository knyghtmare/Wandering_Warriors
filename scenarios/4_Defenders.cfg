[scenario]
    id="4_Defenders"
    map_file=4_Defenders.map
    name="Defenders"
    turns=30
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=5_Odd_Enimity
    [variables]
        Irisk = 1
        Alarek = 1
        Arag = 1
    [/variables]
    [story]
        [part]
            story = "It was not long after the Aragwaithi had taken the fortress that they were surprised by a large force of orcish warriors."
        [/part]
        [part]
            story = "For now, they were surrounded in the icy winter fortress."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name = "Aragwaith"
        {GOLD 180 160 140}
        type = "Aragwaith Guard"
        name = _ "Meranyc"
        id = "Meranyc"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Orcish Grunt, Orcish Warrior, Orcish Archer, Orcish Crossbowman, Goblin Knight, Wolf Rider"
        team_name = "Orcs"
        user_team_name = "Orcs"
        {GOLD 140 160 180}
        income = 6
        type = "Orcish Warlord"
        name = "Irisk"
        id = "Irisk"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Young Ogre, Ogre, Wolf Rider, Goblin Knight, Goblin Pillager, Orcish Assassin, Orcish Slayer, Orcish Grunt, Orcish Archer"
        team_name = "Orcs"
        user_team_name = "Orcs"
        {GOLD 160 180 200}
        income = 6
        type = "Orcish Nightblade"
        name = "Alarek"
        id = "Alarek"
        unrenameable = yes
    [/side]
    [side]
        side = 4
        controller = ai
        canrecruit = yes
        recruit = "Troll Whelp, Troll Shaman, Troll, Troll Rocklobber"
        team_name = "Orcs"
        user_team_name = "Trolls"
        {GOLD 160 180 200}
        income = 6
        type = "Troll Warrior"
        name = "Arag"
        id = "Arag"
        unrenameable = yes
    [/side]
    [side]
        side = 5
        controller = ai
        canrecruit = yes
        recruit = "Saurian Skirmisher, Saurian Oracle, Saurian Soothsayer, Saurian Augur, Saurian Ambusher"
        team_name = "Drakes"
        user_team_name = "Saurians"
        {GOLD 140 160 180}
        income = 12
        type = "Saurian Flanker"
        name = "Issir"
        id = "Issir"
        unrenameable = yes
    [/side]
    [side]
        side = 6
        controller = ai
        canrecruit = yes
        recruit = "Drake Clasher, Drake Burner, Fire Drake, Drake Thrasher, Drake Arbiter, Drake Fighter, Drake Warrior"
        team_name = "Drakes"
        user_team_name = "Drakes"
        {GOLD 160 180 200}
        income = 12
        type = "Drake Warden"
        name = "Halerd"
        id = "Halerd"
        unrenameable = yes
    [/side]
    [side]
        side = 7
        controller = ai
        canrecruit = yes
        recruit = "Drake Clasher, Drake Burner, Fire Drake, Drake Thrasher, Drake Arbiter, Drake Fighter, Drake Warrior"
        team_name = "Drakes"
        user_team_name = "Drakes"
        {GOLD 160 180 200}
        income = 18
        type = "Armageddon Drake"
        name = "Ashan"
        id = "Ashan"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Kill the Orcish leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [recall]
            id = Asidel
            x = 18
            y = 19
        [/recall]
    [/event]
    [event]
        name = start
        [message]
            speaker = Alarek
            message = "There! These fire-lizards shall face the wrath of the orcs!"
        [/message]
        [message]
            speaker = Irisk
            message = "And Aragwaithi too? Well, they shall face the wrath of the warlords, no matter what the council of the Northern Alliance may say!"
        [/message]
        [message]
            speaker = Ashan
            message = "It is I, commander of the largest part of the army of Ashak'kahan, and now the orcs and Aragwaithi shall both be destroyed!"
        [/message]
        [message]
            speaker = Meranyc
            message = "Hold fast, men! They shall waste their forces against the walls of this keep, and stain the snow red with the blood of drakes and orcs!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Irisk
        [/filter]
        [message]
            speaker = Meranyc
            message = "We have slain the orcish warlord!"
        [/message]
        [set_variable]
            name = Irisk
            value = 0
        [/set_variable]
        [if]
            [and]
                [variable]
                    name = Alarek
                    numerical_equals = 0
                [/variable]
                [variable]
                    name = Arag
                    numerical_equals = 0
                [/variable]
            [/and]
            [then]
                [message]
                    speaker = Asidel
                    message = "The way back South is clear. Let us leave this land of ice and snow."
                [/message]
                [endlevel]
                    result = victory
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Alarek
        [/filter]
        [message]
            speaker = Alarek
            message = "Alas, for the cloth-spearmen have slain me."
        [/message]
        [set_variable]
            name = Alarek
            value = 0
        [/set_variable]
        [if]
            [and]
                [variable]
                    name = Irisk
                    numerical_equals = 0
                [/variable]
                [variable]
                    name = Arag
                    numerical_equals = 0
                [/variable]
            [/and]
            [then]
                [message]
                    speaker = Asidel
                    message = "The way back South is clear. Let us leave this land of ice and snow."
                [/message]
                [endlevel]
                    result = victory
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Arag
        [/filter]
        [message]
            speaker = Arag
            message = "Trolls should not fall. They are strong. They do not die."
        [/message]
        [set_variable]
            name = Arag
            value = 0
        [/set_variable]
        [if]
            [and]
                [variable]
                    name = Alarek
                    numerical_equals = 0
                [/variable]
                [variable]
                    name = Irisk
                    numerical_equals = 0
                [/variable]
            [/and]
            [then]
                [message]
                    speaker = Asidel
                    message = "The way back South is clear. Let us leave this land of ice and snow."
                [/message]
                [endlevel]
                    result = victory
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Meranyc
        [/filter]
        [message]
            speaker = Meranyc
            message = "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Asidel"
        [/filter]
        [message]
            speaker = Asidel
            message = "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
