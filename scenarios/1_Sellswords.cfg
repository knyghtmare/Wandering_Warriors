[scenario]
    id="1_Sellswords"
    map_file=1_Sellswords.map
    name="Sellswords"
    turns=30
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=2_Drake_Mountains
	experience_modifier={ON_DIFFICULTY 80 80 100}
	
    [story]
        [part]
            story =_  "Ever since the establishment of a small northern kingdom, the mercenaries of the Aragwaith have been the gold standard of a fighting force for hire, aiding the people and governments of the West-North."
        [/part]
        [part]
            story =_  "On this day, a village has hired the troops of Mamoru and Ayame, two Aragwaithi nobles, to destroy some bandits who recently moved into a ruined mountain hideout."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 140 120 100}
        type = "Aragwaith Guard"
        name = _ "Mamoru"
        id = "Mamoru"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Thug, Footpad, Poacher, Ruffian"
        team_name = "Enemies"
        user_team_name =_  "Bandits"
        {GOLD 160 180 200}
        type = "Bandit"
        name = "Ilern"
        id = "Ilern"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Defeat all enemy leaders."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [unit]
            type="Aragwaith Enchantress"
            canrecruit=yes
            id="Ayame"
            name = _ "Ayame"
            side = 1
            x = 18
            y = 19
            [modifications]
                {TRAIT_LOYAL_HERO}
                {TRAIT_RESILIENT}
                {TRAIT_DEXTROUS}
            [/modifications]
        [/unit]
    [/event]
    [event]
        name = start
        [message]
            speaker = Mamoru
            message =_  "Here we are! The village of Anithorpe, and the outlaws!"
        [/message]
        [message]
            speaker = Ayame
            message =_  "Criminals! Vacate thy den of thieves, or face the wrath of the Aragwaithi."
        [/message]
        [message]
            speaker = Ilern
            message =_  "This stronghold is our only defense! Never shall we leave such a well-crafted fortress!"
        [/message]
        [message]
            speaker = Mamoru
            message =_  "Soldiers, attack!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id=Ilern
        [/filter]
        [message]
            speaker = Ilern
            message =_  "Alas, we are overwhelmed by the Aragwaithi!"
        [/message]
        {LOOT 100 1}
    [/event]
    [event]
        name = last breath
        [filter]
            id = Mamoru
        [/filter]
        [message]
            speaker = Mamoru
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Ayame"
        [/filter]
        [message]
            speaker = Ayame
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
