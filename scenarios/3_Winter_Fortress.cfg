[scenario]
    id="3_Winter_Fortress"
    map_file=3_Winter_Fortress.map
    name="Winter Fortress"
    turns=20
    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}
    next_scenario=4_Defenders
    experience_modifier={ON_DIFFICULTY 80 80 100}
    
    [story]
        [part]
            story =_  "They followed the drake messenger still westwards, coming eventually to a river with an old island fortress that once protected the surrounding valleys from wandering orcs."
        [/part]
        [part]
            story =_  "Now, however, it had been empty for many years—until the drakes captured it this past autumn."
        [/part]
    [/story]
    [side]
        side = 1
        controller = human
        canrecruit = yes
        recruit = "Aragwaith Spearman, Aragwaith Swordsman, Aragwaith Scout, Aragwaith Archer, Aragwaith Adept, Aragwaith Eagle Rider"
        team_name = "Allies"
        user_team_name =_  "Aragwaith"
        {GOLD 180 160 140}
        type = "Aragwaith Guard"
        name = _ "Mamoru"
        id = "Mamoru"
        unrenameable = yes
        [modifications]
            {TRAIT_LOYAL}
            {TRAIT_STRONG}
            {TRAIT_RESILIENT}
        [/modifications]
    [/side]
    [side]
        side = 2
        controller = ai
        canrecruit = yes
        recruit = "Drake Burner, Drake Clasher, Drake Fighter, Fire Drake, Drake Warrior"
        team_name = "Enemies"
        user_team_name =_  "Fortress Drakes"
        {GOLD 140 160 180}
        income = 20
        type = "Inferno Drake"
        name = "Lython"
        id = "Lython"
        unrenameable = yes
    [/side]
    [side]
        side = 3
        controller = ai
        canrecruit = yes
        recruit = "Saurian Skirmisher, Saurian Oracle, Saurian Soothsayer, Saurian Augur, Saurian Ambusher"
        team_name = "Enemies"
        user_team_name =_  "Saurians"
        {GOLD 140 160 180}
        income = 10
        type = "Saurian Flanker"
        name = "Issir"
        id = "Issir"
        unrenameable = yes
    [/side]
    [side]
        side = 4
        controller = ai
        canrecruit = yes
        recruit = "Drake Clasher, Drake Burner, Fire Drake, Drake Thrasher, Drake Arbiter"
        team_name = "Enemies"
        user_team_name =_  "Drakes"
        {GOLD 160 180 200}
        income = 10
        type = "Drake Warden"
        name = "Halerd"
        id = "Halerd"
        unrenameable = yes
    [/side]
    [side]
        side = 5
        controller = ai
        canrecruit = yes
        recruit = "Drake Clasher, Drake Burner, Fire Drake, Drake Thrasher, Drake Arbiter"
        team_name = "Enemies"
        user_team_name =_  "Drake Messengers"
        {GOLD 160 180 200}
        income = 10
        type = "Hurricane Drake"
        name = "Nium"
        id = "Nium"
        unrenameable = yes
    [/side]
    [event]
        name = prestart

        [objectives]
            side=1
            [objective]
                condition=win
                description= _ "Defeat Lython, the drake in the fortress."
            [/objective]
            [objective]
                condition=lose
                description= _ "Death of the heroes."
            [/objective]
            {TURNS_RUN_OUT}
        [/objectives]

        [recall]
            id = Ayame
            x = 43
            y = 31
        [/recall]
    [/event]
    [event]
        name = start
        [message]
            speaker = Mamoru
            message =_  "Blast! We have ridden as swiftly as the breeze, yet it is not for nothing that they are called the Hurricane Drakes."
        [/message]
        [message]
            speaker = Nium
            message =_  "My fellow drakes! We must halt these Aragwaithi here, for they move with the orcs. If we hold them south of the river, we shall drive them off!"
        [/message]
        [message]
            speaker = Ayame
            message =_  "Orcs? We are not with them! So, good sir, we may not be in confl—"
        [/message]
        [message]
            speaker = Lython
            message =_  "Now two armies face us! We must destroy them, and then the orcs!"
        [/message]
    [/event]
    [event]
        name = last breath
        [filter]
            id=Lython
        [/filter]
        [message]
            speaker = Lython
            message =_  "This fortress may have fallen, but the might of the drakes shall yet defeat you!"
        [/message]
        {LOOT 150 1}
        [endlevel]
            result = victory
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id = Mamoru
        [/filter]
        [message]
            speaker = Mamoru
            message =_  "Thus I fall, and so do my soldiers."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
    [event]
        name = last breath
        [filter]
            id="Ayame"
        [/filter]
        [message]
            speaker = Ayame
            message =_  "Dear Gods..."
        [/message]
        [endlevel]
            result = defeat
        [/endlevel]
    [/event]
[/scenario]
